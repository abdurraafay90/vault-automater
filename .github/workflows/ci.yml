name: CI

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  checks-and-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: |
          npm run typecheck
          npm run build
          npm run test
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag vault-automater-api:ci .
      - name: Build Web image
        run: docker build --file apps/web/Dockerfile --build-arg NEXT_PUBLIC_SITE_URL=https://vault.wickhub.cc --tag vault-automater-web:ci .
      - name: Build Worker image
        run: docker build --file apps/worker/Dockerfile --tag vault-automater-worker:ci .

# Configure this job as a required check named "checks-and-images" in the
# main branch ruleset or branch protection settings.