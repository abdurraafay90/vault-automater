# Production deployment (e.g. vault.wickhub.cc):
#   1. Put a TLS-terminating reverse proxy (Cloudflare Tunnel, Caddy, nginx)
#      in front of the `web` service — this app only serves plain HTTP.
#   2. Set APP_ORIGIN, NEXT_PUBLIC_SITE_URL and TRUST_PROXY in .env (see
#      .env.example). NEXT_PUBLIC_SITE_URL is read at build time, so re-run
#      `docker compose up -d --build` after changing it.
#   3. `api` is intentionally not published beyond localhost: the browser only
#      ever reaches it through `web`'s /api proxy over the internal network.
#
# No Postgres/Redis: everything (auth, custom vaults, automation jobs) lives
# in SQLite under the vaultflow_api_data volume, shared by api and worker.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["vaultflow_api_data:/repo/.data"]

  # Executes scheduled automations and CSV batches. Shares the API's SQLite
  # volume (where encrypted jobs live). Exactly one worker may run.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes: ["vaultflow_api_data:/repo/.data"]
    # On stop, let sends already broadcasting finish and record their result
    # (confirmation waits up to 10 minutes) before Docker force-kills it.
    stop_grace_period: 11m
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Only affects build-time SEO metadata (canonical link, Open Graph
        # image resolution) — never used for API calls. Falls back to
        # localhost when unset, e.g. building without a filled-in .env.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4560}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:4000
    ports: ["4560:4560"]
    depends_on:
      - api

volumes:
  vaultflow_api_data:
