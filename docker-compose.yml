services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vaultflow:vaultflow@postgres:5432/vaultflow
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ["4000:4000"]
    volumes: ["vaultflow_api_data:/repo/.data"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vaultflow:vaultflow@postgres:5432/vaultflow
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
    ports: ["4560:4560"]
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaultflow
      POSTGRES_USER: vaultflow
      POSTGRES_PASSWORD: vaultflow
    ports: ["5432:5432"]
    volumes: ["vaultflow_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultflow -d vaultflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["vaultflow_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vaultflow_postgres:
  vaultflow_redis:
  vaultflow_api_data:
